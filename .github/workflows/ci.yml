name: CI

# Every push to main: run the tests, and if they pass, build the native-AOT
# distributable for each target and publish it to all three distribution
# channels, each gated on the same green build:
#
#   1. a rolling "latest" prerelease of the raw binaries (what install.sh and
#      install.ps1 pull from) - the recommended install;
#   2. a multi-arch container image on GHCR, which ships those same binaries;
#   3. a .NET global tool on the GitHub Packages NuGet feed - the IL build,
#      not the AOT one, so it needs the .NET 9 runtime.
#
# Native AOT cannot cross-compile across OSes, so each target builds on its
# own runner.
#
# osx-x64 (Intel Mac) is intentionally omitted: GitHub's macos-13 (Intel)
# runners are scarce and routinely queue 20+ min, which would stall the
# gated release. Apple Silicon is standard now, so osx-arm64 covers modern
# Macs. The code still supports the osx-x64 RID for anyone building on an
# Intel Mac locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release job creates/updates the rolling release + tag
  packages: write # docker + nuget jobs publish to GHCR and GitHub Packages

# A newer commit supersedes an in-flight run so the rolling release always
# reflects the newest green commit (and two runs never race on the tag).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore LlmWiki.sln
      - name: Test
        run: dotnet test tests/Wiki.Tests/Wiki.Tests.csproj -c Release --no-restore

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Native-AOT link prerequisites. Linux needs clang + zlib headers.
      - name: Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # macOS AOT links against OpenSSL (crypto) and brotli (compression),
      # which Homebrew keeps keg-only and off the default linker path.
      - name: macOS AOT prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 brotli || true
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix brotli)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Publish (native AOT)
        run: dotnet publish src/Wiki/Wiki.csproj -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf wiki-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} wiki

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.rid }}/wiki.exe -DestinationPath wiki-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-${{ matrix.rid }}
          path: wiki-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Rolling release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha_short="${GITHUB_SHA:0:7}"
          # Recreate the 'latest' tag/release at this commit so it always
          # points at the newest green main build.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest main build ($sha_short)" \
            --notes "Automated native-AOT build from main @ $sha_short (run #${GITHUB_RUN_NUMBER}).

          Binaries: linux-x64, linux-arm64, win-x64, osx-arm64. Unix targets are \`.tar.gz\` (contains \`wiki\`); Windows is \`.zip\` (contains \`wiki.exe\`)."

  # The image is a shipping vehicle for the binary the build job already
  # produced - it compiles nothing. See docker/Dockerfile for why the base
  # image tracks the runner's Ubuntu version.
  docker:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # GHCR rejects an uppercase path, and the owner here is mixed case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Lay the two Linux binaries out as $TARGETPLATFORM/wiki, which is what
      # the Dockerfile's COPY resolves against.
      - name: Assemble build context
        run: |
          mkdir -p ctx/linux/amd64 ctx/linux/arm64
          tar -xzf dist/wiki-linux-x64.tar.gz   -C ctx/linux/amd64
          tar -xzf dist/wiki-linux-arm64.tar.gz -C ctx/linux/arm64
          cp docker/Dockerfile ctx/Dockerfile

      # No setup-qemu-action, deliberately: the Dockerfile runs nothing in the
      # target stage, so the arm64 image is assembled - not executed - on this
      # amd64 runner. Adding a RUN there would put apt-get under emulation and
      # make QEMU a prerequisite again.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  # The NuGet channel is the odd one out: `dotnet tool` has no native-AOT
  # story, so this ships the IL build. It is published for people already
  # living in the .NET toolchain, not pointed at newcomers.
  nuget:
    name: NuGet global tool
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Rolling prerelease version: monotonic in run number, and marked
      # prerelease so `dotnet tool install` only picks it up with
      # --prerelease. The assembly version is untouched.
      - name: Pack
        run: dotnet pack src/Wiki/Wiki.csproj -c Release -o nupkg -p:PackageVersion=1.0.0-main.${{ github.run_number }}

      - name: Push
        run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
